services:
  - type: web
    name: fueltracker
    runtime: node
    plan: free
    branch: main
    buildCommand: cd client && npm install --include=dev && npx vite build && cd ../server && npm install && npm run build
    startCommand: cd server && NODE_ENV=production node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d

  - type: web
    name: fueltracker-staging
    runtime: node
    plan: free
    branch: develop
    buildCommand: cd client && npm install --include=dev && npx vite build && cd ../server && npm install && npm run build
    startCommand: cd server && NODE_ENV=production node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
